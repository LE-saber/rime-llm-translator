name: Build Ubuntu installer
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 python3-yaml g++ librime-dev librime-bin librime-plugin-lua rime-data-luna-pinyin
      - name: Syntax check
        run: |
          python3 -m py_compile src/rime_llm_translator.py
          luac5.4 -p lua/rime_llm_translator.lua
          luac5.4 -p lua/rime_llm_ai_hotkey.lua
          lua5.4 tests/test_lua_filter.lua
          bash -n packaging/build-deb.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Real Rime candidate integration (isolated HOME)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/rime_candidates.cc -lrime -o /tmp/rime-candidates-test
          mkdir -p "$RUNNER_TEMP/rime-native" "$RUNNER_TEMP/rime-with-filter/lua"
          cp lua/rime_llm_translator.lua lua/rime_llm_ai_hotkey.lua "$RUNNER_TEMP/rime-with-filter/lua/"
          printf 'patch:\n  "engine/filters/+":\n    - "lua_filter@*rime_llm_translator"\n  "engine/processors/@before 0": "lua_processor@*rime_llm_ai_hotkey"\n' > "$RUNNER_TEMP/rime-with-filter/luna_pinyin.custom.yaml"
          echo "== Baseline: real Rime without our filter =="
          timeout 90s /tmp/rime-candidates-test "$RUNNER_TEMP/rime-native" /usr/share/rime-data
          echo "== Real Rime with active Lua filter and seeded translation =="
          export HOME="$RUNNER_TEMP/rime-test-home"
          python3 tests/seed_rime_cache.py "$HOME" mt
          test ! -e "$HOME/.cache/rime-llm-translator/ai.req"
          timeout 90s /tmp/rime-candidates-test "$RUNNER_TEMP/rime-with-filter" /usr/share/rime-data "Hello from Offline MT" "$HOME/.cache/rime-llm-translator/ai.req"
          echo "== AI cache supersedes offline MT after explicit hotkey =="
          python3 tests/seed_rime_cache.py "$HOME" ai
          timeout 90s /tmp/rime-candidates-test "$RUNNER_TEMP/rime-with-filter" /usr/share/rime-data "Hello from Rime AI"
          echo "== Ensure compiled schema includes the actual Lua filter =="
          grep -Fn 'lua_filter@*rime_llm_translator' "$RUNNER_TEMP/rime-with-filter/build/luna_pinyin.schema.yaml"
          grep -Fn 'lua_processor@*rime_llm_ai_hotkey' "$RUNNER_TEMP/rime-with-filter/build/luna_pinyin.schema.yaml"
      - name: Build .deb
        run: bash packaging/build-deb.sh
      - name: Inspect installer
        run: |
          dpkg-deb -c dist/*.deb
          test "$(dpkg-deb -f dist/*.deb Architecture)" = all
          test "$(dpkg-deb -f dist/*.deb Package)" = rime-llm-translator
      - name: Smoke-test installable package
        run: |
          sudo apt-get install -y ./dist/*.deb
          command -v rime-llm-translator
          rime-llm-translator doctor
      - uses: actions/upload-artifact@v4
        with:
          name: rime-llm-translator-ubuntu24.04
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb --generate-notes
